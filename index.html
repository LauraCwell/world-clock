<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura's World Clock App </title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="headerContainer">
        <h1>World Clock</h1>
        <h2>Your Local Time:</h2>
        <div class="localTime">2:04:15 PM</div>
        <select name="" id="">
            <option value="">Select a City</option>
            <option value="America/NewYork">New York 🇺🇸</option>
            <option value="Europe/Paris">Paris 🇫🇷</option>
            <option value="Australia/Sydney">Sydney 🇦🇺</option>
            <option value="Asia/Beijing">Beijing 🇨🇳</option>
        </select>
    </div>
    <div class="citiesContainer">
        <div class="flagEmoji">🇺🇸</div>
        <div class="sunMoonEmoji">☀️</div>
        <h2>New York</h2>
        <div>United States of America</div>
        <div>2:04:15 PM</div>
        <div>Monday 14 September</div>
        <div>GMT + 5</div>

        <div class="flagEmoji">🇫🇷</div>
        <div class="sunMoonEmoji">☀️</div>
        <h2>Paris</h2>
        <div>France</div>
        <div>2:04:15 PM</div>
        <div>Monday 14 September</div>
        <div>GMT + 1</div>
    </div>
    <footer> This project was coded by Laura Cardwell and is <a href="https://github.com/LauraCwell/world-clock" target="blank"> open-sourced on Github </a>🕰️</footer>
    <script src="javascript/index.js"></script>
</body>
</html>
